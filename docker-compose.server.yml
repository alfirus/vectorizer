services:
  vectorizer:
    build: .
    container_name: vectorizer
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:50051:50051"
    env_file:
      - .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      EMBED_PROVIDER: openai-compatible
      EMBED_MODEL: text-embedding-nomic-embed-text-v2
      EMBED_DIMENSIONS: 768
      LM_STUDIO_URL: http://100.121.188.113:1234/v1
      LIBRARIAN_MODE: workflow
      VAULT_ROOT: /data/ai
    volumes:
      - /opt/vectorizer/vault-data:/data/ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chromadb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  chromadb:
    image: chromadb/chroma:1.0.0
    container_name: vectorizer-chromadb
    ports:
      - "127.0.0.1:8102:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    restart: unless-stopped

  dashboard:
    build: ../vectorizer-dashboard
    container_name: vectorizer-dashboard
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      PORT: 8092
      VECTORIZER_URL: http://vectorizer:8091
      VECTORIZER_API_KEY: vectorizer-local-key
      CHROMA_URL: http://chromadb:8000
      LM_STUDIO_URL: http://100.121.188.113:1234/v1
      LM_STUDIO_KEY: ${LM_STUDIO_API_KEY}
      LLM_MODEL: qwen3.6-35b-a3b-uncensored-hauhaucs-aggressive
      VAULT_ROOT: /data/ai
      GRAPH_PATH: /data/ai/maisarah/vault/00-index/GRAPH.json
      REINDEX_PYTHON: python3
    volumes:
      - /opt/vectorizer/vault-data:/data/ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      vectorizer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  chroma_data:
