services:
  vectorizer:
    build: .
    container_name: vectorizer
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:50051:50051"
    env_file:
      - .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      # 1536d Qwen is the OPT-IN for this host (canonical default is 768d
      # Nomic — P0-1). Set these explicitly in the private .env instead of
      # relying on compose defaults.
      EMBED_PROVIDER: openai-compatible
      EMBED_MODEL: text-embedding-nomic-embed-text-v2
      EMBED_DIMENSIONS: 768
      # Live LLM endpoint: private .env only (LM_STUDIO_URL,
      # LM_STUDIO_API_KEY). Never commit the tailnet address.
      LM_STUDIO_URL: ${LM_STUDIO_URL:?set LM_STUDIO_URL in the private .env}
      LIBRARIAN_MODE: workflow
      VAULT_ROOT: /data/ai
    volumes:
      # Live data dir: private .env only (VAULT_DATA_DIR). Never commit it.
      - ${VAULT_DATA_DIR:?set VAULT_DATA_DIR in the private .env}:/data/ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chromadb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-8091}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vectorizer-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: vectorizer-mcp
    # Loopback ONLY — reachable via Tailscale IP from your laptop, never public.
    # UFW default denies inbound; Tailscale interface bypasses UFW anyway.
    ports:
      - "127.0.0.1:8093:8093"
    environment:
      VECTORIZER_URL: http://vectorizer:8091
      VECTORIZER_API_KEY: ${DEFAULT_API_KEY}
      MCP_HTTP_PORT: 8093
      MCP_HTTP_HOST: 0.0.0.0
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}
    depends_on:
      vectorizer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8093/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  chromadb:
    # Canonical ChromaDB pin: 1.0.0 everywhere (P0-1). Validate a new minor
    # in staging before bumping both compose files + docs together.
    image: chromadb/chroma:1.0.0
    container_name: vectorizer-chromadb
    ports:
      - "127.0.0.1:8102:8000"
    volumes:
      # Chroma 1.0.0 persists to /data per baked-in /config.yaml (persist_path)
      # — PERSIST_DIRECTORY env is ignored. Mount here or vectors live in the
      # container layer and a recreate wipes everything.
      - chroma_data:/data
      # t_19c13e16: chroma image ships no HTTP client (no wget/curl/python in
      # PATH) and dash (no /dev/tcp), so the probe uses the host's statically
      # linked /usr/bin/busybox (verified BUSYBOX_STATIC_OK 2026-10-07).
      # /api/v2/heartbeat returns 200 (v1 returns 410 on chroma 1.0.0).
      - /usr/bin/busybox:/busybox:ro
    environment:
      IS_PERSISTENT: "TRUE"
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build: ../vectorizer-dashboard
    container_name: vectorizer-dashboard
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      PORT: 8092
      VECTORIZER_URL: http://vectorizer:8091
      VECTORIZER_API_KEY: ${DEFAULT_API_KEY}
      CHROMA_URL: http://chromadb:8000
      # Live LLM endpoint/model: private .env only. Never commit them.
      LM_STUDIO_URL: ${LM_STUDIO_URL:?set LM_STUDIO_URL in the private .env}
      LM_STUDIO_KEY: ${LM_STUDIO_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      VAULT_ROOT: /data/ai
      # Vault graph location differs per install: private .env only.
      GRAPH_PATH: ${GRAPH_PATH:?set GRAPH_PATH in the private .env}
      REINDEX_PYTHON: python3
    volumes:
      - ${VAULT_DATA_DIR:?set VAULT_DATA_DIR in the private .env}:/data/ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      vectorizer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  chroma_data:
