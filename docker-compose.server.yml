services:
  vectorizer:
    build: .
    container_name: vectorizer
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:50051:50051"
    env_file:
      - .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      # 1536d Qwen is the OPT-IN for this host (canonical default is 768d
      # Nomic — P0-1). Set these explicitly in the private .env instead of
      # relying on compose defaults.
      EMBED_PROVIDER: openai-compatible
      EMBED_MODEL: text-embedding-nomic-embed-text-v2
      EMBED_DIMENSIONS: 768
      # Live LLM endpoint: private .env only (LM_STUDIO_URL,
      # LM_STUDIO_API_KEY). Never commit the tailnet address.
      LM_STUDIO_URL: ${LM_STUDIO_URL:?set LM_STUDIO_URL in the private .env}
      # t_ce4e18be (upstreamed via t_247beff1): workspaces hidden from
      # fleet-wide search (search_all + unscoped search/ask). CSV, default
      # finance. Scoped reads naming the workspace keep working.
      SEARCH_EXCLUDE_WORKSPACES: ${SEARCH_EXCLUDE_WORKSPACES:-finance}
      LIBRARIAN_MODE: workflow
      VAULT_ROOT: /data/ai
    volumes:
      # Live data dir: private .env only (VAULT_DATA_DIR). Never commit it.
      - ${VAULT_DATA_DIR:?set VAULT_DATA_DIR in the private .env}:/data/ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chromadb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-8091}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vectorizer-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: vectorizer-mcp
    # Loopback ONLY — reachable via Tailscale IP from your laptop, never public.
    # UFW default denies inbound; Tailscale interface bypasses UFW anyway.
    ports:
      - "127.0.0.1:8093:8093"
    environment:
      VECTORIZER_URL: http://vectorizer:8091
      VECTORIZER_API_KEY: ${DEFAULT_API_KEY}
      MCP_HTTP_PORT: 8093
      MCP_HTTP_HOST: 0.0.0.0
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}
    depends_on:
      vectorizer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8093/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  chromadb:
    # Canonical ChromaDB pin: 1.0.0 everywhere (P0-1). Validate a new minor
    # in staging before bumping both compose files + docs together.
    image: chromadb/chroma:1.0.0
    container_name: vectorizer-chromadb
    ports:
      - "127.0.0.1:8102:8000"
    volumes:
      # Chroma 1.0.0 persists to /data per baked-in /config.yaml (persist_path)
      # — PERSIST_DIRECTORY env is ignored. Mount here or vectors live in the
      # container layer and a recreate wipes everything.
      - chroma_data:/data
      # t_19c13e16: chroma image ships no HTTP client (no wget/curl/python in
      # PATH) and dash (no /dev/tcp), so the probe uses the host's statically
      # linked /usr/bin/busybox (verified BUSYBOX_STATIC_OK 2026-10-07).
      # /api/v2/heartbeat returns 200 (v1 returns 410 on chroma 1.0.0).
      - /usr/bin/busybox:/busybox:ro
    environment:
      IS_PERSISTENT: "TRUE"
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build: ../vectorizer-dashboard
    container_name: vectorizer-dashboard
    ports:
      - "127.0.0.1:8092:8092"
    # P1-4: run as the host owner (uid/gid 1000 = ubuntu) so the mounted
    # vectorizer .env (mode 600 ubuntu:ubuntu) is readable/writable.
    # The image-default nextjs user (uid 1001) would get EACCES on the mount.
    user: "1000:1000"
    environment:
      PORT: 8092
      # Dashboard API gate (fail-closed 503 when unset). Committed here after
      # running as an uncommitted server hot-edit — the token value itself
      # lives only in the private .env.
      DASHBOARD_AUTH_TOKEN: ${DASHBOARD_AUTH_TOKEN:?set DASHBOARD_AUTH_TOKEN in the private .env}
      VECTORIZER_URL: http://vectorizer:8091
      VECTORIZER_API_KEY: ${DEFAULT_API_KEY}
      CHROMA_URL: http://chromadb:8000
      # Live LLM endpoint/model: private .env only. Never commit them.
      LM_STUDIO_URL: ${LM_STUDIO_URL:?set LM_STUDIO_URL in the private .env}
      LM_STUDIO_KEY: ${LM_STUDIO_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      VAULT_ROOT: /data/ai
      # Vault graph location differs per install: private .env only.
      GRAPH_PATH: ${GRAPH_PATH:?set GRAPH_PATH in the private .env}
      REINDEX_PYTHON: python3
      # P1-4 settings/deploy wiring: the dashboard container has no vectorizer
      # checkout, so the live .env is shared by file mount (see volumes below
      # and dashboard README "Docker settings"). Writes need a vectorizer
      # recreate to take effect (the vectorizer reads .env once at create).
      SETTINGS_ENV_PATH: /run/vectorizer-env/.env
      SETTINGS_SCHEDULES_PATH: /run/vectorizer-env/cron_schedules.json
      # Explicit index-script location (code falls back to VAULT_ROOT-based
      # lookup when unset). Override in the private .env when scripts move.
      REINDEX_SCRIPT_DIR: ${REINDEX_SCRIPT_DIR:-/data/ai/maisarah/vault/00-index}
    volumes:
      - ${VAULT_DATA_DIR:?set VAULT_DATA_DIR in the private .env}:/data/ai
      # P1-4: live .env mount for dashboard settings read/write. The source
      # file must exist (it always does — the vectorizer service requires it);
      # a missing source makes compose create a directory here and breaks
      # settings reads. up.sh verify checks the file exists.
      - ./.env:/run/vectorizer-env/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      vectorizer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  chroma_data:
