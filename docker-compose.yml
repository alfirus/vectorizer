services:
  vectorizer:
    build: .
    container_name: vectorizer
    ports:
      - "${PORT:-8091}:${PORT:-8091}"
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    env_file:
      - .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      EMBED_PROVIDER: ${EMBED_PROVIDER:-openai-compatible}
      EMBED_MODEL: ${EMBED_MODEL:-Qwen/Qwen3-Embedding-4B-GGUF}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-1536}
      OAI_COMPATIBLE_URL: ${OAI_COMPATIBLE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_URL: ${LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chromadb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-8091}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: vLLM Qwen3-Embedding-4B at 1536d (GPU). For LM Studio GGUF, ignore this service.
  # Enable with: docker compose --profile gpu up -d
  qwen-embed:
    image: vllm/vllm-openai:latest
    container_name: vectorizer-qwen-embed
    command: >-
      --model Qwen/Qwen3-Embedding-4B
      --hf-overrides '{"is_matryoshka":true,"matryoshka_dimensions":[1536,2560]}'
      --pooler-config '{"dimensions":1536}'
      --max-model-len 32768
      --dtype auto
      --enforce-eager
    ports:
      - "${QWEN_PORT:-8001}:8000"
    volumes:
      - qwen_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    profiles: ["gpu"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  chromadb:
    image: chromadb/chroma:1.0.0
    container_name: vectorizer-chromadb
    ports:
      - "${CHROMA_PORT:-8100}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    restart: unless-stopped

volumes:
  chroma_data:
  qwen_cache:
