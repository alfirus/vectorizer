services:
  vectorizer:
    build: .
    container_name: vectorizer
    ports:
      - "${PORT:-8091}:${PORT:-8091}"
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    env_file:
      - .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      EMBED_PROVIDER: ${EMBED_PROVIDER:-openai-compatible}
      EMBED_MODEL: ${EMBED_MODEL:-Qwen/Qwen3-Embedding-4B}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-1536}
      OAI_COMPATIBLE_URL: ${OAI_COMPATIBLE_URL:-http://qwen-embed:8000/v1}
    depends_on:
      chromadb:
        condition: service_healthy
      qwen-embed:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-8091}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Qwen3-Embedding-4B at 1536d via vLLM MRL (1536d)
  # Requires Docker with NVIDIA runtime for GPU. For CPU-only dev, keep using nomic-embed-text (768d) by setting EMBED_MODEL=nomic-embed-text.
  qwen-embed:
    image: vllm/vllm-openai:latest
    container_name: vectorizer-qwen-embed
    command: >-
      --model Qwen/Qwen3-Embedding-4B
      --hf-overrides '{"is_matryoshka":true,"matryoshka_dimensions":[1536,2560]}'
      --pooler-config '{"dimensions":1536}'
      --max-model-len 32768
      --dtype auto
      --enforce-eager
    ports:
      - "${QWEN_PORT:-8001}:8000"
    volumes:
      - qwen_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    restart: unless-stopped
    # no healthcheck auto - vLLM loads 4B (~9GB VRAM), may take 60-90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  chromadb:
    image: chromadb/chroma:1.0.0
    container_name: vectorizer-chromadb
    ports:
      - "${CHROMA_PORT:-8100}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  chroma_data:
  qwen_cache:
