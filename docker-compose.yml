services:
  vectorizer:
    build: .
    container_name: vectorizer
    ports:
      - "${PORT:-8091}:${PORT:-8091}"
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    env_file:
      - .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      EMBED_PROVIDER: ${EMBED_PROVIDER:-openai-compatible}
      EMBED_MODEL: ${EMBED_MODEL:-Qwen/Qwen3-Embedding-4B-GGUF}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-1536}
      OAI_COMPATIBLE_URL: ${OAI_COMPATIBLE_URL:-http://host.docker.internal:1234/v1}
      OAI_API_KEY: ${OAI_API_KEY:-${LM_STUDIO_API_KEY:-}}
      LM_STUDIO_URL: ${LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-${LM_STUDIO_API_KEY:-}}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-lm-studio}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_STUDIO_URL: ${LLM_STUDIO_URL:-${LM_STUDIO_URL:-http://host.docker.internal:1234/v1}}
      LLM_OAI_COMPATIBLE_URL: ${LLM_OAI_COMPATIBLE_URL:-}
      LLM_OAI_API_KEY: ${LLM_OAI_API_KEY:-${LM_STUDIO_API_KEY:-}}
      LIBRARIAN_MODE: ${LIBRARIAN_MODE:-workflow}
      TTL_HOURS: ${TTL_HOURS:-0}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - "C:/Users/alfir/SynologyDrive/ai:/data/ai:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chromadb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: vLLM Qwen3-Embedding-4B at 1536d (GPU). For LM Studio GGUF, ignore this service.
  # Enable with: docker compose --profile gpu up -d
  qwen-embed:
    image: vllm/vllm-openai:latest
    container_name: vectorizer-qwen-embed
    command: >-
      --model Qwen/Qwen3-Embedding-4B
      --hf-overrides '{"is_matryoshka":true,"matryoshka_dimensions":[1536,2560]}'
      --pooler-config '{"dimensions":1536}'
      --max-model-len 32768
      --dtype auto
      --enforce-eager
    ports:
      - "${QWEN_PORT:-8001}:8000"
    volumes:
      - qwen_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    profiles: ["gpu"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  chromadb:
    image: chromadb/chroma:1.0.0
    container_name: vectorizer-chromadb
    ports:
      - "${CHROMA_PORT:-8100}:8000"
    volumes:
      # Chroma 1.0.0 persists to /data per baked-in /config.yaml (persist_path)
      # — PERSIST_DIRECTORY env is ignored. Mount here or vectors live in the
      # container layer and a recreate wipes everything.
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    restart: unless-stopped

  dashboard:
    build: ../vectorizer-dashboard
    container_name: vectorizer-dashboard
    ports:
      - "8092:8092"
    env_file:
      - .env
    environment:
      VECTORIZER_URL: http://vectorizer:8091
      VECTORIZER_API_KEY: ${VECTORIZER_API_KEY:-${DEFAULT_API_KEY:-vectorizer-local-key}}
      CHROMA_URL: http://chromadb:8000
      LM_STUDIO_URL: ${LM_STUDIO_URL:-${OAI_COMPATIBLE_URL:-http://host.docker.internal:1234/v1}}
      LM_STUDIO_KEY: ${LM_STUDIO_API_KEY:-${OAI_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6-35b-a3b-uncensored-hauhaucs-aggressive}
      GRAPH_PATH: /data/ai/maisarah/vault/00-index/GRAPH.json
      VAULT_ROOT: /data/ai
    volumes:
      - "C:/Users/alfir/SynologyDrive/ai:/data/ai:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      vectorizer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  chroma_data:
  qwen_cache:
