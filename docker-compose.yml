services:
  vectorizer:
    build: .
    container_name: vectorizer
    ports:
      - "${PORT:-8091}:${PORT:-8091}"
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    env_file:
      - .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-8091}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  chromadb:
    image: chromadb/chroma:1.0.0
    container_name: vectorizer-chromadb
    ports:
      - "${CHROMA_PORT:-8100}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  chroma_data:
